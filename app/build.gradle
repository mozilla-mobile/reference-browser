apply from: "$project.rootDir/automation/gradle/versionCode.gradle"

def baseVersionCode = generatedVersionCode

import com.android.build.api.variant.BuildConfigField
import com.android.build.api.variant.FilterConfiguration

androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        if (variantBuilder.buildType == "release") {
            variantBuilder.enable = false
        }
        if (variantBuilder.buildType == "nightly") {
            variantBuilder.enableUnitTest = true
        }
    }

    def sentryTokenFile = providers.fileContents(rootProject.layout.projectDirectory.file(".sentry_token")).asText
    String sentryToken = sentryTokenFile.map { '"' + it.trim() + '"' }.getOrElse("null")
    if (sentryTokenFile.present) {
        println("(Added Sentry token from file)")
    }
    boolean crashReporting = providers.gradleProperty("crashReportEnabled").orNull == "true"
    boolean telemetry = providers.gradleProperty("telemetry").orNull == "true"
    boolean official = providers.gradleProperty("official").present || gradle.hasProperty("localProperties.official")
    boolean aab = providers.gradleProperty("aab").present
    String versionName = providers.gradleProperty("versionName").getOrElse("")

    onVariants(selector().all()) { variant ->
        variant.buildConfigFields.put("SENTRY_TOKEN",
                new BuildConfigField("String", sentryToken, "Sentry Token"))
        variant.buildConfigFields.put("CRASH_REPORTING_ENABLED",
                new BuildConfigField("boolean", crashReporting.toString(), "Crash Reporting"))
        variant.buildConfigFields.put("TELEMETRY_ENABLED",
                new BuildConfigField("boolean", telemetry.toString(), "Telemetry"))
        variant.buildConfigFields.put("MOZILLA_OFFICIAL",
                new BuildConfigField("Boolean", official.toString(), "Official Build"))

        if (variant.buildType == "nightly") {
            def baseCode = baseVersionCode + baseVersionCode % 2 // Ensure even

            variant.outputs.each { output ->
                def abiName = output.filters.find { it.filterType == FilterConfiguration.FilterType.ABI }?.identifier
                def addedCode = aab ? 1 : ([x86_64: 6, 'arm64-v8a': 2][abiName] ?: 0)

                output.versionCode.set(baseCode + addedCode)
                output.versionName.set(versionName)
            }
        }
    }
}

android {
    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(Config.jvmTargetCompatibility)
        targetCompatibility = JavaVersion.toVersion(Config.jvmTargetCompatibility)
    }

    buildToolsVersion = Config.buildToolsVersion
    compileSdk {
        version = release(Config.compileSdkMajorVersion) {
            minorApiLevel = Config.compileSdkMinorVersion
        }
    }

    defaultConfig {
        applicationId = "org.mozilla.reference.browser"
        minSdk = Config.minSdkVersion
        targetSdk = Config.targetSdkVersion
        versionCode = 1
        versionName = Config.generateDebugVersionName()

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
        }
        nightly {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release'] // Use on the "release" build type in dependencies (AARs)

            if (gradle.hasProperty("localProperties.autosignReleaseWithDebugKey")) {
                signingConfig = signingConfigs.debug
            }

            if (gradle.hasProperty("localProperties.debuggable")) {
                debuggable = true
            }

            buildConfigField "boolean", "IS_RELEASED", "true"
        }
    }

    testOptions {
        execution = 'ANDROIDX_TEST_ORCHESTRATOR'
        animationsDisabled = true
        unitTests {
            includeAndroidResources = true
        }
    }

    lint {
        lintConfig = file("lint.xml")
        disable += ['GradleDependency', 'AndroidGradlePluginVersion']
        warningsAsErrors = true
    }

    splits {
        abi {
            enable = true

            reset()

            include "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    namespace = 'org.mozilla.reference.browser'
}

kotlin {
    compilerOptions {
        allWarningsAsErrors = true
    }
}

// Select the Glean from GeckoView.
// `service-sync-logins` requires Glean, which pulls in glean-native,
// but that's also provided by geckoview-omni, so now we need to select which one to use.
project.configurations.configureEach {
    resolutionStrategy.capabilitiesResolution.withCapability("org.mozilla.telemetry:glean-native") {
        def toBeSelected = candidates.find { it.id instanceof ModuleComponentIdentifier && it.id.module.contains('geckoview') }
        if (toBeSelected != null) {
            select(toBeSelected)
        }
        because 'use GeckoView Glean instead of standalone Glean'
    }
}

